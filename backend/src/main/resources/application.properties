# =========================================
# EVENTRA Runtime Configuration
# Event-Driven Programming Language Engine
# =========================================

# -----------------------------
# SERVER CONFIGURATION
# -----------------------------

server.port=8080

# -----------------------------
# APPLICATION NAME
# -----------------------------

spring.application.name=EVENTRA

# -----------------------------
# CORS CONFIGURATION
# -----------------------------

spring.web.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

spring.web.cors.allowed-headers=*

spring.web.cors.allow-credentials=true

# -----------------------------
# LOGGING CONFIGURATION
# -----------------------------

logging.level.com.eventra=DEBUG

logging.level.org.springframework.web=INFO

logging.pattern.console=%d{HH:mm:ss} [%level] %msg%n

# -----------------------------
# RUNTIME DEBUGGING
# -----------------------------

spring.main.banner-mode=console